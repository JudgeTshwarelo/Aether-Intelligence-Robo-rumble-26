<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AETHER | Live Footage</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #050d15; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
    overflow: hidden;
  }
  header {
    height: 60px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; background: rgba(5,10,16,0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: 3px; }
  .logo span { color: #00d9ff; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 20px; font-size: 11px;
    letter-spacing: 2px; font-weight: 600;
    background: rgba(0,255,136,0.12); color: #00ff88;
    transition: background 0.2s, color 0.2s;
  }
  .pill.bad { background: rgba(255,50,70,0.15); color: #ff3344; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 8px currentColor;
  }
  main {
    position: relative; height: calc(100% - 60px);
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at top, #0c1a2e, #050a10 70%);
  }
  #camera-frame {
    width: 100%; height: 100%; border: none; display: block;
  }
  .hint-text {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #7f94a6; font-size: 11px; letter-spacing: 1.5px;
    background: rgba(5,10,16,0.85); padding: 6px 14px; border-radius: 20px;
    pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <div class="logo">AETHER <span>LIVE FOOTAGE</span></div>
  <div class="pill" id="statusPill">
    <span class="dot"></span>
    <span id="statusText">CONNECTING…</span>
  </div>
</header>

<main>
  <!--
    🔧 Manual IP — change this if the ESP32 gets a new one.
    The camera's stock web UI is served here in an iframe.
  -->
  <iframe
    id="camera-frame"
    src="http://192.168.137.182/"
    title="ESP32 Camera"
    allow="autoplay">
  </iframe>

  <div class="hint-text">
    Press <strong>Start Stream</strong> inside the camera page to begin live video
  </div>
</main>

<script>
  const frame = document.getElementById('camera-frame');
  const pill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');

  const CAMERA_URL = 'http://192.168.137.182';

  function setStatus(online) {
    pill.classList.toggle('bad', !online);
    statusText.textContent = online ? 'LIVE' : 'OFFLINE';
  }

  // The iframe won't fire onerror reliably across origins.
  // Instead, poll a lightweight endpoint on the ESP32 (`/` returns HTML fast).
  // We use a HEAD-like fetch with `no-cors` to just test connectivity.
  async function pollCamera() {
    try {
      // no-cors fetch will resolve as opaque if the host is reachable
      await fetch(CAMERA_URL + '/?_=' + Date.now(), {
        mode: 'no-cors',
        cache: 'no-store',
      });
      setStatus(true);
    } catch {
      setStatus(false);
    }
  }

  // Initial check + periodic
  pollCamera();
  setInterval(pollCamera, 5000);
</script>

</body>
</html>
